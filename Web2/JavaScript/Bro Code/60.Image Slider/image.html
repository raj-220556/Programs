<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel = "stylesheet" href = "image.css">
</head>
<body>

    <div class = "slider">
        <div class = "slides">
            <img class = "slide" src ="car1.png" alt = "CAR 1">
            <img class = "slide" src ="car2.png" alt = "CAR 2">
            <img class = "slide" src ="car3.png" alt = "CAR 3">
            <img class = "slide" src ="car4.png" alt = "CAR 4">
            <img class = "slide" src ="car5.png" alt = "CAR 5">
            <img class = "slide" src ="car6.png" alt = "CAR 6">
            <img class = "slide" src ="car7.png" alt = "CAR 7">
            <img class = "slide" src ="car8.png" alt = "CAR 8">
        </div>
        <button class = "prev" onclick="prevSlide()">&#10094</button>
        <button class = "next" onclick="nextSlide()">&#10095</button>
    </div>
    

    <script src = "image.js"></script>
</body>
</html>
