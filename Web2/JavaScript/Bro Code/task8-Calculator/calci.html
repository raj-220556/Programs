<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator pogram</title>
    <link rel = "stylesheet" href = "calci.css">
</head>
<body>

    <div id = "calculator">
        <input id = "display" readonly>
        <div id="keys">
            <button onclick = "console.log('Button + clicked'); appendToDisplay('+')" class="operatorbtn">+</button>
            <button onclick = "console.log('Button 7 clicked'); appendToDisplay('7')">7</button>
            <button onclick = "console.log('Button 8 clicked'); appendToDisplay('8')">8</button>
            <button onclick = "console.log('Button 9 clicked'); appendToDisplay('9')">9</button>
            <button onclick = "console.log('Button - clicked'); appendToDisplay('-')" class="operatorbtn">-</button>
            <button onclick = "console.log('Button 4 clicked'); appendToDisplay('4')">4</button>
            <button onclick = "console.log('Button 5 clicked'); appendToDisplay('5')">5</button>
            <button onclick = "console.log('Button 6 clicked'); appendToDisplay('6')">6</button>
            <button onclick = "console.log('Button * clicked'); appendToDisplay('*')" class="operatorbtn">*</button>
            <button onclick = "console.log('Button 1 clicked'); appendToDisplay('1')">1</button>
            <button onclick = "console.log('Button 2 clicked'); appendToDisplay('2')">2</button>
            <button onclick = "console.log('Button 3 clicked'); appendToDisplay('3')">3</button>
            <button onclick = "appendToDisplay('/')" class="operatorbtn">/</button>
            <button onclick = "console.log('Button 0 clicked'); appendToDisplay('0')">0</button>
            <button onclick = "console.log('Button . clicked'); appendToDisplay('.')">.</button>
            <button onclick = "console.log('Button = clicked'); calculate()">=</button>
            <button onclick = "console.log('Button C clicked'); allClear()" class="operatorbtn">C</button>

        </div>
    </div>
    

    <script type  src = "calci.js"></script>
</body>
</html>
