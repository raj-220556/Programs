<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Form & Greeting</title>
    <link rel="stylesheet" href="task7x.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
        <p id="greeting" class="greeting-message"></p>
    </header>

    <main>
        <div class="form-container">
            <h2>Data Entry</h2>
            <form id="dataForm">
                
                <div class="form-group">
                    <label for="id">Id Number: </label>
                    <input type="text" id="id" placeholder="e.g., N12345" required>
                    <span id="id-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="name">Name :</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                    <span id="name-error" class="error-message"></span>
                </div>
                
                <div class="form-group radio-group">
                    <label>Gender :</label>
                    <input type="radio" id="malebtn" name="gender" value="Male" required>
                    <label for="malebtn">Male</label>
                    <input type="radio" id="femalebtn" name="gender" value="Female">
                    <label for="femalebtn">Female</label>
                    <span id="gender-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="branch">Branch :</label>
                    <select id="branch" required>
                        <option value="" disabled selected>Select a Branch</option>
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="MECH">MECH</option>
                        <option value="CIVIL">CIVIL</option>
                    </select>
                    <span id="branch-error" class="error-message"></span>
                </div>
                
                <button type="submit" id="submitBtn">Submit Data</button>
            </form>
        </div>
        
        <div class="print-section">
            <button id="printBtn">🖨️ Print This Page</button>
        </div>

    </main>
    
    <script src="tsk7x.js"></script>
</body>
</html>
